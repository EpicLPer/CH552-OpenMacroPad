<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Macropad</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">

<header>
  <h1>Macropad</h1>
  <span class="ver" id="pageVersion">Version 4</span>
  <span class="grow"></span>
  <button id="connect" class="primary" type="button">Connect</button>
  <div id="device" class="device">Pad firmware —</div>
</header>

<div class="hostbar" id="hostbar">
  <label>Keyboard <select id="layout" disabled></select></label>
  <label>System <select id="os" disabled></select></label>
  <button id="matchHost" class="ghost" type="button" disabled>Match this computer</button>
  <span id="hostNote" class="hint"></span>
</div>

<main>
  <section class="stage">
    <div id="pad" class="pad-wrap"></div>
    <p class="legend">Top and bottom knobs: left, press, right.</p>
  </section>

  <section class="panel editor">
    <h2 id="editing">Key</h2>
    <div id="editor" hidden>
      <label for="binding">Binding</label>
      <div class="bindrow">
        <input id="binding" type="text" autocomplete="off" spellcheck="false"
               placeholder="@, ctrl+z, enter">
        <button id="capture" type="button">Capture</button>
      </div>
      <div id="mods" class="mods"></div>

      <label for="function">Other</label>
      <select id="function"></select>
      <div id="stepsRow" hidden>
        <label for="steps">Steps</label>
        <input id="steps" type="number" min="1" max="127" value="1">
      </div>
      <div id="rawRow" hidden>
        <label for="rawUsage">Usage</label>
        <input id="rawUsage" type="number" min="1" max="119" value="100">
      </div>

      <button id="clear" class="texty" type="button">Clear</button>
      <div class="preview"><strong id="preview">nothing</strong></div>
    </div>
    <p id="editorEmpty" class="hint">Click a key or a knob.</p>
  </section>
</main>

<details class="firmware">
  <summary>Firmware</summary>
  <div class="update-row">
    <input id="fwFile" type="file" accept=".bin,application/octet-stream">
    <button id="fwGo" class="primary" type="button" disabled>Update</button>
  </div>
  <progress id="fwProgress" max="1" value="0"></progress>
  <p id="fwNote" class="hint">Choose the .web.bin file.</p>
</details>

<footer>
  <button id="apply" class="primary" disabled>Apply</button>
  <button id="revert" disabled>Discard</button>
  <button id="reload">Reload</button>
  <span class="grow"></span>
  <button id="save">Save</button>
  <button id="load">Load</button>
  <button id="defaults" class="danger">Defaults</button>
  <button id="boot" class="danger">Bootloader</button>
  <input id="file" type="file" accept="application/json" hidden>
</footer>

<div id="status" class="status"></div>

</div>
<script src="bindings.js"></script>
<script src="hidpad.js"></script>
<script src="app.js"></script>
<script src="update.js"></script>
</body>
</html>
